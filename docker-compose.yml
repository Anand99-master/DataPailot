# ==============================================================================
# DATAPILOT DOCKER COMPOSE CONFIGURATION
# Production-like local deployment stack with PostgreSQL & DataPilot
# ==============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: datapilot_postgres
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: true
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datapilot} -d ${POSTGRES_DB:-datapilot_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datapilot_net

  datapilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapilot_app
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - datapilot_net

volumes:
  postgres_data:
    driver: local

networks:
  datapilot_net:
    driver: bridge
